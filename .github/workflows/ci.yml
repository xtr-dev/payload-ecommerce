name: CI

# Runs the checks a release depends on (typecheck, lint, tests, packed build) on
# every PR into main or dev and on pushes to those branches, so a PR that breaks
# them is caught before merge rather than at publish time.
on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

# A new push supersedes the run still going for the previous commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # MongoDB server version that mongodb-memory-server downloads for "Test (MongoDB)".
  # Pinned so the cached binary below stays valid until this line changes.
  MONGOMS_VERSION: 7.0.14

jobs:
  check:
    name: ${{ matrix.task.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task:
          - name: Typecheck
            run: pnpm typecheck
          - name: Lint
            run: pnpm lint
          - name: Test
            run: pnpm test
          # The same integration tests against an in-memory MongoDB replica set, for the
          # plugin's MongoDB-specific statements and its behaviour inside transactions.
          - name: Test (MongoDB)
            run: pnpm test:mongo
            mongodb: true
          - name: Build and verify packed exports
            run: pnpm test:pack
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Saves downloading the MongoDB server binary (about 100 MB) on every run.
      - name: Cache MongoDB binary
        if: matrix.task.mongodb
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ env.MONGOMS_VERSION }}

      - name: ${{ matrix.task.name }}
        run: ${{ matrix.task.run }}
        env:
          # Where mongodb-memory-server keeps its download; only "Test (MongoDB)" uses it.
          MONGOMS_DOWNLOAD_DIR: ${{ runner.temp }}/mongodb-binaries
